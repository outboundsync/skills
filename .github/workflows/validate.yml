name: Validate skill integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run integrity checks
        run: ./scripts/validate_skill_integrity.sh
